<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusPill</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><style>html,body{margin:0}</style></head>
<body class="ng ng-pad">
<div class="ng-col ng-col--loose">
 <div class="ng-col"><span class="ng-label">Investigation</span><div class="ng-row"><span class="ng-pill"><i>○</i>Draft</span><span class="ng-pill ng-pill--steer"><i>✎︎</i>Plan review</span><span class="ng-pill ng-pill--live"><i>●</i>Running</span><span class="ng-pill ng-pill--warn"><i>‖</i>Paused · by you</span><span class="ng-pill ng-pill--warn"><i>‖</i>Paused · spending limit</span><span class="ng-pill ng-pill--live"><i>◐</i>Synthesising</span><span class="ng-pill ng-pill--ok"><i>✓</i>Completed</span><span class="ng-pill"><i>■</i>Stopped</span></div></div>
 <div class="ng-col"><span class="ng-label">Node · execution</span><div class="ng-row"><span class="ng-pill ng-pill--ghost"><i>◌</i>Proposed</span><span class="ng-pill ng-pill--danger ng-pill--hollow"><i>⊘</i>Rejected</span><span class="ng-pill"><i>○</i>Pending</span><span class="ng-pill ng-pill--live"><i>●</i>Running</span><span class="ng-pill ng-pill--live ng-pill--hollow"><i>◔</i>Waiting on children</span><span class="ng-pill ng-pill--warn"><i>‖</i>Paused</span><span class="ng-pill ng-pill--ok"><i>✓</i>Completed</span><span class="ng-pill ng-pill--danger"><i>✕</i>Failed</span></div></div>
 <div class="ng-col"><span class="ng-label">Node · inclusion</span><div class="ng-row"><span class="ng-muted ng-small">Included (no pill)</span><span class="ng-pill ng-pill--steer ng-pill--hollow"><i>⦸</i>Ignored by you</span><span class="ng-pill ng-pill--ghost"><i>↺</i>Superseded by re-plan</span></div></div>
</div>
</body>
</html>
