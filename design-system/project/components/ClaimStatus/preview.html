<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ClaimStatus</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><style>html,body{margin:0}</style></head>
<body class="ng ng-pad">
<div class="ng-col ng-col--loose">
 <div class="ng-col"><span class="ng-label">Claim status</span><div class="ng-row"><span class="ng-pill ng-pill--ok"><i>✓✓</i>Confirmed</span><span class="ng-pill ng-pill--ok ng-pill--hollow"><i>✓</i>Supported</span><span class="ng-pill"><i>?</i>Unverified</span><span class="ng-pill ng-pill--warn"><i>⇄</i>Contested</span><span class="ng-pill ng-pill--danger"><i>✕</i>Refuted</span></div></div>
 <div class="ng-col"><span class="ng-label">Premise outcome</span><div class="ng-row"><span class="ng-pill ng-pill--ok"><i>✓</i>Premise confirmed</span><span class="ng-pill ng-pill--danger"><i>✕</i>Premise refuted</span><span class="ng-pill"><i>?</i>Could not be verified</span></div></div>
 <div class="ng-col"><span class="ng-label">Source credibility</span><div class="ng-row"><span class="ng-tag ng-tag--solid">PRIMARY</span><span class="ng-tag">REPUTABLE</span><span class="ng-tag ng-tag--dashed">WEAK</span><span class="ng-mono ng-muted">2 independent · 5 pages (4 repeat one wire report)</span></div></div>
</div>
</body>
</html>
