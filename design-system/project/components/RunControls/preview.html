<!-- @dsCard group="Steering" height=250 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RunControls</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"><style>html,body{margin:0}</style></head>
<body class="ng ng-pad">
<div class="ng-col ng-col--loose">
 <div class="ng-row"><span style="width:150px"><span class="ng-pill ng-pill--steer"><i>✎︎</i>Plan review</span></span><button class="ng-btn ng-btn--steer">Approve plan</button><button class="ng-btn ng-btn--quiet">Discard draft</button></div>
 <div class="ng-row"><span style="width:150px"><span class="ng-pill ng-pill--live"><i>●</i>Running</span></span><button class="ng-btn">‖ Pause</button><button class="ng-btn">Finish now</button><button class="ng-btn ng-btn--quiet">Stop</button></div>
 <div class="ng-row"><span style="width:150px"><span class="ng-pill ng-pill--warn"><i>‖</i>Paused · by you</span></span><button class="ng-btn ng-btn--steer">Resume</button><button class="ng-btn">Finish now</button><button class="ng-btn ng-btn--quiet">Stop</button></div>
 <div class="ng-row"><span style="width:150px"><span class="ng-pill ng-pill--live"><i>◐</i>Synthesising</span></span><span class="ng-small ng-muted">No controls. The report is being written from the evidence store.</span></div>
 <div class="ng-row"><span style="width:150px"><span class="ng-pill"><i>■</i>Stopped</span></span><button class="ng-btn ng-btn--steer">Resume</button><button class="ng-btn">Finish into a report</button></div>
 <div class="ng-row"><span style="width:150px"><span class="ng-pill ng-pill--ok"><i>✓</i>Completed</span></span><button class="ng-btn">Open report</button><button class="ng-btn ng-btn--quiet">Export Markdown</button></div>
</div>
</body>
</html>
